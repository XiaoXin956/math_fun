# 数学乐园 一键部署：web(nginx 静态+反代) + 后端(Dart)
# 数据库用远程 MySQL（配置在 math_fun_service/.env）
#
# 访问：
#   Web 客户端 http://<本机IP>:8083   （/api 由 nginx 反代到后端容器）
#   后端 API  http://<本机IP>:8082   （供手机 App 直连）
#
# 手机 App 需确认 math_fun_app/lib/api/config.dart 的 apiBaseUrl
# 默认值指向后端对外可达地址（当前 http://47.250.81.247:8082）
#
# 启动：
#   docker compose up -d --build
# 停止：
#   docker compose down

services:
  # ---------- Flutter web：nginx 托管静态文件 + /api 反代 ----------
  web:
    build:
      context: ./math_fun_app
      dockerfile: Dockerfile.web
    image: math_fun_web
    container_name: math_fun_web
    restart: unless-stopped
    ports:
      - "8083:8083"
    depends_on:
      - math_fun_service

  # ---------- 后端 API ----------
  math_fun_service:
    build:
      context: ./math_fun_service
      dockerfile: Dockerfile
    image: math_fun_service
    container_name: math_fun_service
    restart: unless-stopped
    # 用 .env 注入 DB_USER / DB_PASSWORD / DB_NAME / DB_SECURE / PORT 等配置
    env_file:
      - ./math_fun_service/.env
    # 数据库在本机 mysql 容器，已加入本 compose 网络，用容器名直连最稳定。
    # environment 优先级高于 env_file，覆盖 .env 中连不通的 DB_HOST/DB_PORT。
    # 容器间通信走 mysql 容器内部端口 3306（不经宿主机 13306 映射）。
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
    ports:
      - "8082:8082"
